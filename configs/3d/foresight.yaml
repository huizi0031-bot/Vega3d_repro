schema_version: 1
description: Scene understanding with query slots and frozen Wan video supervision.
seed: 42
data:
  train: data/processed/scanqa_train_llava_style.json
  validation: data/processed/scanqa_val_llava_style.json
  require_disjoint_validation_scenes: true
  frame_count: 32
  max_translation: 0.5
  max_rotation: 30.0
  feature_id: wan22_ti2v_offline_uniform32_1280x704_t300_b20_s42_v1
model:
  initial_checkpoint: data/models/Qwen3.5-2B-Language
  vision_checkpoint: data/models/siglip-so400m-patch14-384
  wan_checkpoint: data/models/Wan2.2-TI2V-5B
  language_hidden_size: 2048
  generative_feature_dim: 3072
  ground_head_type: null
  queries: 32
  wan_context_dim: 4096
  teacher_frames: 5
  teacher_height: 256
  teacher_width: 320
  flow_shift: 5.0
  teacher_gradient_checkpointing: true
training:
  output_root: checkpoints
  epochs: 1
  max_steps: -1
  micro_batch: 1
  global_batch: 8
  learning_rate: 1.0e-5
  foresight_learning_rate: 1.0e-4
  weight_decay: 0.0
  optimizer: adamw_torch
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_epsilon: 1.0e-8
  max_grad_norm: 1.0
  warmup_ratio: 0.03
  scheduler: cosine
  model_max_length: 32768
  save_steps: 50
  data_workers: 0
  precision: bf16
  gradient_checkpointing: true
  deepspeed: scripts/zero3.json
  torch_compile: false
  tune: mm_vision_tower,mm_mlp_adapter,mm_language_model
  vision_learning_rate: 2.0e-6
foresight:
  mode: video
  video_loss_weight: 0.1
