schema_version: 1
description: ScanQA heldout-view pilot; engineering configuration, not tuned paper settings.
seed: 42
data:
  root: data/scanqa_foresight
  train_original: train_original.json
  train_paired: train_paired.jsonl
  validation: val_original.json
  frame_count: 32
  feature_id: wan22_ti2v_offline_uniform32_1280x704_t300_b20_s42_v1
model:
  initial_checkpoint: data/models/Qwen3.5-2B-Language
  vision_checkpoint: data/models/siglip-so400m-patch14-384
  wan_checkpoint: data/models/Wan2.2-TI2V-5B
  language_hidden_size: 2048
  generative_feature_dim: 3072
  queries: 32
  wan_context_dim: 4096
  teacher_frames: 5
  teacher_height: 256
  teacher_width: 320
  flow_shift: 5.0
  teacher_gradient_checkpointing: true
training:
  output_root: checkpoints
  epochs: 1
  max_steps: -1
  micro_batch: 1
  global_batch: 8
  learning_rate: 1.0e-5
  foresight_learning_rate: 1.0e-4
  weight_decay: 0.0
  optimizer: adamw_torch
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_epsilon: 1.0e-8
  max_grad_norm: 1.0
  warmup_ratio: 0.03
  scheduler: cosine
  model_max_length: 32768
  save_steps: 50
  data_workers: 0
  precision: bf16
  gradient_checkpointing: true
  deepspeed: scripts/zero3.json
  torch_compile: false
  tune: mm_vision_tower,mm_mlp_adapter,mm_language_model
  vision_learning_rate: 2.0e-6
experiments:
  E00:
    description: Matched VEGA baseline; same questions and 32 observations.
    queries_enabled: false
    video_loss_weight: 0.0
    paired_data: false
  E01:
    description: Continuous query slots with QA loss only.
    queries_enabled: true
    video_loss_weight: 0.0
    paired_data: false
  E03:
    description: Query slots plus frozen-Wan conditional flow supervision.
    queries_enabled: true
    video_loss_weight: 0.1
    paired_data: true
