[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vega3d-foresight"
version = "0.1.0"
description = "VEGA-3D scene understanding with Qwen3.5, Wan2.2 and foresight supervision"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}

[tool.setuptools.packages.find]
include = ["llava*"]

[tool.black]
line-length = 120
